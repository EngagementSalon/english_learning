<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频课播放器测试页</title>
<style>
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1f2937; }
  h1 { font-size: 22px; }
  .drop { border: 2px dashed #d1d5db; border-radius: 12px; padding: 40px; text-align: center; color: #6b7280; margin: 20px 0; cursor: pointer; }
  .drop.drag { border-color: #3b82f6; background: #eff6ff; }
  .box { background: #f9fafb; border-radius: 12px; padding: 20px; margin-top: 16px; }
  label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }
  video { width: 100%; border-radius: 8px; background: #000; margin-top: 12px; }
  .info { font-size: 13px; color: #6b7280; margin-top: 8px; }
  .btn { margin-top: 12px; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; background: #2563eb; color: #fff; font-size: 14px; }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .done-box { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 12px 14px; margin-top: 16px; display: none; }
  .done-box.show { display: block; }
  .note { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #92400e; margin-top: 16px; }
</style>
</head>
<body>
<h1>🎬 视频课播放器测试页</h1>
<p style="color:#6b7280">把电脑上的视频拖进下方区域，或填入一个 mp4 直链，即可测试播放器与「看完确认」流程。</p>

<div class="drop" id="drop">将视频文件拖到这里<br><span style="font-size:12px">或点击选择文件</span></div>
<input type="file" id="file" accept="video/*" style="display:none">

<div class="box">
  <label>或粘贴 mp4 直链：</label>
  <input type="text" id="url" placeholder="https://.../xxx.mp4">
  <button class="btn" onclick="loadByUrl()">加载播放</button>
</div>

<div id="playerArea"></div>

<div class="note">⚠️ 说明：当前测试页是本地播放，能正常播放即代表视频课功能正常。正式使用时，需要把这个 mp4 链接填到刷题平台「视频课」里，学员即可观看。</div>

<script>
  const drop = document.getElementById('drop')
  const fileInput = document.getElementById('file')
  const playerArea = document.getElementById('playerArea')

  drop.addEventListener('click', () => fileInput.click())
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadVideo(URL.createObjectURL(e.target.files[0])) })
  ;['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag') }))
  ;['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag') }))
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadVideo(URL.createObjectURL(f)) })

  function loadByUrl() {
    const u = document.getElementById('url').value.trim()
    if (!u) return alert('请先粘贴 mp4 直链')
    loadVideo(u)
  }

  function loadVideo(src) {
    const video = document.createElement('video')
    video.controls = true
    video.playsInline = true
    video.src = src
    let pct = 0, confirmed = false
    video.addEventListener('timeupdate', () => {
      const dur = video.duration || 0
      pct = dur > 0 ? (video.currentTime / dur) * 100 : 0
      document.getElementById('pct').textContent = '已观看 ' + Math.min(100, Math.round(pct)) + '%'
      if (pct >= 90 && !confirmed) { document.getElementById('confirmArea').style.display = 'block'; confirmed = true }
    })
    playerArea.innerHTML = `
      <div class="box">
        <p class="info" id="pct">已观看 0%</p>
        ${''}
        <div id="confirmArea" style="display:none">
          <div class="done-box show" style="margin-top:0">
            <p style="margin:0 0 10px;font-size:14px;color:#065f46">视频已看完，请确认完成。</p>
            <button class="btn" onclick="this.disabled=true;alert('✓ 已确认完成！')">我已看完，确认完成</button>
          </div>
        </div>
      </div>`
    playerArea.querySelector('.box').insertBefore(video, playerArea.querySelector('#pct'))
  }
</script>
</body>
</html>
